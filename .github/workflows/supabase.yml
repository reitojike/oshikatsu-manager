# 何を守っているか:
# フェーズ1でSupabaseが導入された後、db test(RLS検証含む)と生成型のコミット漏れが
# 検出されずにmainへ入ることを防ぐゲート(docs/prd.md 8.2「生成型の運用」/ 8.6)。
# `supabase/config.toml` はフェーズ1(issue #23)でコミット済みの必須成果物のため、
# 無い場合は「未初期化として黙ってスキップ」せず、このジョブ自体を失敗させる
# (誤ってsupabase/を削除するPRが緑のまま通り抜けることを防ぐ)。
# Supabase CLIのバージョンはローカルと揃えて固定する(ずれると「マイグレーション忘れ」
# ではなく「CLI差」で落ち、誰も信じなくなるため)。
name: Supabase

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: supabase-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SUPABASE_CLI_VERSION: "2.111.0"

jobs:
  db-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: yarn
      - run: corepack enable
      - run: yarn install --frozen-lockfile

      - name: Check for supabase/config.toml
        run: |
          if [ ! -f supabase/config.toml ]; then
            echo "::error::supabase/config.toml が見つかりません。フェーズ1でコミット済みの必須成果物です。誤って削除していないか確認してください。"
            exit 1
          fi

      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - run: supabase start

      # test/db/ が認証済みクライアントでRLSを検証するために接続情報を渡す。
      # service_roleキーはエクスポートしない(test/db/では使わない。docs/permissions.md)。
      - name: Export local Supabase connection info
        # supabase status -o env は値をダブルクォートで囲んで出力するが、
        # GITHUB_ENV はクォートを解釈しないため、そのまま渡すと値にクォートが
        # 含まれてしまう(例: API_URL が `"http://127.0.0.1:54321"` になる)。
        # --override-nameは指定したキーの出力名を変えるだけで、SERVICE_ROLE_KEY等の
        # 他のキーはそのまま出力に残る。API_URL/ANON_KEY以外がGITHUB_ENVに
        # 紛れ込まないよう、grepで対象の2行だけに絞ってから渡す。
        run: |
          supabase status -o env --override-name api.url=API_URL --override-name auth.anon_key=ANON_KEY \
            | grep -E '^(API_URL|ANON_KEY)=' \
            | sed 's/^\([A-Z_]*\)="\(.*\)"$/\1=\2/' >> "$GITHUB_ENV"

      - run: yarn test:db

  types-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: yarn
      - run: corepack enable
      - run: yarn install --frozen-lockfile

      - name: Check for supabase/config.toml
        run: |
          if [ ! -f supabase/config.toml ]; then
            echo "::error::supabase/config.toml が見つかりません。フェーズ1でコミット済みの必須成果物です。誤って削除していないか確認してください。"
            exit 1
          fi

      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - run: supabase start

      - run: yarn gen:types

      # ローカル開発機にDockerが無く `yarn gen:types --local` を手元で実行できない
      # 場合でも、生成結果をここから取得してコミットできるようにする。
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: supabase-types
          path: supabase/types.ts

      - name: supabase/types.ts に差分がないことを確認
        # git diff だけだと未追跡ファイル(コミットし忘れ)を検出できないため、
        # 一旦stageしてから差分を見る。既存の内容と一致していればstageしても差分は出ない。
        run: |
          git add -A -- supabase/types.ts
          git diff --cached --exit-code -- supabase/types.ts
