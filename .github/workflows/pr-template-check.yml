# 何を守っているか:
# Draft前セルフレビュー(issue #81)の記入漏れを検知する。記入内容が真実かは検証できないが、
# セクション自体が欠けている・必須項目が空のPRは止める。HEAD SHAの完全一致は要求しない
# (指摘を修正すると必ず不一致になるため)。
name: PR Template Check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr-template-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Draft前セルフレビューセクションを確認
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node .github/scripts/check-pr-template.mjs
