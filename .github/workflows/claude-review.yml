# 何を守っているか:
# PRの自己チェックとしてClaudeにレビューさせる。実装したモデルとは別視点でのレビューを
# 少なくとも1回(opened/reopened)は自動発火させ、人間が起動を依頼する工程を必須にしない
# (docs/prd.md 8.5)。判定はあくまで参考。マージ可否の最終判断は人間が行う(docs/prd.md 8.6)。
#
# synchronize(push)は起動コストが最大の要因だったため、typesから外して発火自体させない
# (#244)。Draft・Ready双方の反復は review:full ラベルの付け外しによる明示要求で行う
# (.claude/skills/pr-review-flow/SKILL.md「Draftフェーズ」「Ready中の反復」参照)。
name: Claude Review

on:
  pull_request:
    types: [opened, reopened, labeled]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write
  # circuit-breaker step(#262)が `commits/{sha}/check-runs` を読むために必要
  # (GitHubのREST APIがこのエンドポイントにcheck run読み取り権限を要求する)。
  # `--allowedTools`(claude actionにモデルへ渡すツール権限)とは別の軸で、
  # ワークフロー自身のGITHUB_TOKENに対する読み取り専用権限の追加である。
  checks: read

# 無関係なlabel追加でも labeled は発火する。それを同じgroupに入れると
# cancel-in-progress が進行中の実レビューをキャンセルし、代替runはjobがskipされるため
# 「レビューされていないのにcheckが通る」経路になる(skipされたjobのcheckは
# required status checkとしてはpass扱いになる)。無関係なlabel追加のrunだけを
# run_idで隔離して、進行中のレビューを止めない。
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}-${{ (github.event.action == 'labeled' && github.event.label.name != 'review:full') && github.run_id || 'review' }}
  cancel-in-progress: true

jobs:
  claude-review:
    # check名も分岐させる。同じ `claude-review` 名でskipのcheckを報告すると、
    # 同一head SHAに対する最新のcheckがそれになり、実レビューの結果を上書きしてしまう。
    # 通常のrunでは必ず `claude-review` のままにすること(required status checkの対象名)。
    name: ${{ (github.event.action == 'labeled' && github.event.label.name != 'review:full') && 'claude-review-label-ignored' || 'claude-review' }}
    if: github.event.action != 'labeled' || github.event.label.name == 'review:full'
    runs-on: ubuntu-latest
    env:
      # 実際にClaude actionへ渡す許可ツールと同じ文字列を「Claude Review 投稿確認」stepへも
      # 渡すため、1か所にまとめる(#229)。`Read(.claude-pr/**)`は復元対象パスの退避先
      # (実行されない)に限定した読み取り権限。
      CLAUDE_REVIEW_ALLOWED_TOOLS: "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read(.claude-pr/**)"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      # 同一head SHAへのreview:full再発火が繰り返し投稿0件になるパターンを、claude action
      # (有料・最大--max-turns 60まで焼く)を起動する前に検知する(#262)。判定はskip出力の
      # みで、赤・緑の最終判断は常に「Claude Review 投稿確認」stepに一本化する
      # (このstep自体の失敗はjob全体を赤くしない。下記script内のコメント参照)。
      # promptビルド・最終ゲートと同じ理由でscriptをbase SHAに固定する。
      #
      # 下記の`continue-on-error`を`true`にする理由。このstepが参照するscriptは常に
      # base SHA(main)から取得される。check-claude-review.mjsにこのstep用の新しい
      # 呼び出し契約(CHECK_MODE)を追加するPR自身では、mainにまだその契約が無いため、
      # 古いscriptが実行されてCLAUDE_OUTCOME未設定でthrowする(このPR自身では検証
      # できない、Issue #262本文の既知の制約と同じ形)。これが無いと、それだけで
      # job全体が赤くなり、後続のBuild review prompt/Check tokenが暗黙のsuccess()判定で
      # skipされてしまう。マージ後(mainに新しい契約が乗った後)のPRでは通常どおり動く。
      # この理由がマージ後に消えた後の扱い(撤去するか、fail-open安定化のための恒久措置
      # として理由を書き換えて残すか)は
      # docs/pr-review-flow-details.md「同一head SHAへの反復失敗を検知するcircuit
      # breaker」を参照(PO確認・2026-08-16。ここには書き写さない)。
      - name: 直近の同一headへの反復失敗を確認する
        id: circuit-breaker
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_MODE: pre-check
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          CHECK_SCRIPT="$RUNNER_TEMP/check-claude-review.mjs"
          git show "${BASE_SHA}:.github/scripts/check-claude-review.mjs" > "$CHECK_SCRIPT"
          node "$CHECK_SCRIPT"

      # PR headのscriptを実行すると、同じPRがbaseのAGENTS.md読取りや分類を回避できる。
      # prompt構築scriptとレビュー規則の双方をbase SHAに固定し、headへfallbackしない。
      #
      # 「scriptはheadから、規則(AGENTS.md)だけをbaseから読む」中間案は採らない。
      # 抽出する側がheadなら、節の探し方・区切り・分類の対応づけを変えるだけで
      # baseの規則から任意の部分だけを渡せる。規則をbaseに固定しても、
      # それを読む主体がheadにある限り境界は閉じない。
      - name: Build review prompt
        id: prompt
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEW_FULL: ${{ contains(github.event.pull_request.labels.*.name, 'review:full') }}
        run: |
          PROMPT_SCRIPT="$RUNNER_TEMP/build-review-prompt.mjs"
          git show "${BASE_SHA}:.github/scripts/build-review-prompt.mjs" > "$PROMPT_SCRIPT"
          node "$PROMPT_SCRIPT"

      - name: Check for CLAUDE_CODE_OAUTH_TOKEN
        id: check
        run: |
          if [ -n "${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLAUDE_CODE_OAUTH_TOKEN が未設定のためClaudeレビューをスキップします。'claude setup-token' で発行してリポジトリシークレットに追加してください。"
          fi

      - name: Record Claude action start time
        id: claude-started
        if: steps.check.outputs.enabled == 'true'
        run: echo "started_at=$(date --utc +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@5ef2e550a465a721f4f45e4a7d3c340c873e1dcc # v1.0.190
        id: claude
        if: steps.check.outputs.enabled == 'true' && steps.circuit-breaker.outputs.skip != 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # claude-code-actionはenableAllProjectMcpServersを常にtrueにする仕様のため、
          # .mcp.jsonのcodexサーバー(ローカル専用。codex CLI未インストール・未ログインのCI環境では
          # 起動に失敗する)をdisabledMcpjsonServersで個別にブロックする。
          settings: |
            {
              "disabledMcpjsonServers": ["codex"]
            }
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            ${{ steps.prompt.outputs.prompt }}

            PRのheadは既にカレントディレクトリにチェックアウト済みです。ただし一部のパスはセキュリティ機構により `origin/main` の内容へ復元されており、PRの内容ではありません。該当する変更がある場合は、上記の「## 復元対象パスの注意」セクションに個別の案内があります(セクションが無ければこのPRはそれらのパスを変更していません)。
            全体の総評は `gh pr comment` で投稿すること。
            総評コメントの本文には `<!-- claude-review-head-sha:${{ github.event.pull_request.head.sha }} -->` をそのまま含めること。総評には `commit_id` が無いため、無投稿検知はこのrunの投稿を本文マーカーだけで識別する。マーカーを落とすと、投稿していてもレビュー無しと判定されてcheckが赤くなる。
            特定の行に対する指摘は `mcp__github_inline_comment__create_inline_comment`
            (`confirmed: true` を指定)でインラインコメントとして投稿すること。
            指摘はGitHubへのコメントとして投稿し、action応答本文だけで済ませないこと。
          claude_args: |
            --allowedTools "${{ env.CLAUDE_REVIEW_ALLOWED_TOOLS }}" --max-turns 60

      # キャンセル経路の実観測用。一般仕様からは「cancel-in-progressで置き換えられたrunで
      # if: always() のstepが必ず開始されるか」「そのとき claude.outcome が cancelled か
      # skipped か」を断定できないため、実runで観測して #95 に記録する。
      # secretそのものは出さない。
      - name: 実行状態の記録
        if: always()
        env:
          CHECK_OUTCOME: ${{ steps.check.outcome }}
          CHECK_CONCLUSION: ${{ steps.check.conclusion }}
          CHECK_ENABLED: ${{ steps.check.outputs.enabled }}
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
          CLAUDE_CONCLUSION: ${{ steps.claude.outputs.conclusion }}
          CLAUDE_STARTED_AT: ${{ steps.claude-started.outputs.started_at }}
        run: |
          {
            echo "### Claude Review 実行状態"
            echo "- event: ${{ github.event_name }} / ${{ github.event.action }}"
            echo "- check step: outcome=${CHECK_OUTCOME} conclusion=${CHECK_CONCLUSION} enabled=${CHECK_ENABLED}"
            echo "- claude step: outcome=${CLAUDE_OUTCOME} conclusion=${CLAUDE_CONCLUSION}"
            echo "- claude started_at: ${CLAUDE_STARTED_AT}"
            echo "- 検知step開始: $(date --utc +'%Y-%m-%dT%H:%M:%SZ')"
          } >> "$GITHUB_STEP_SUMMARY"

      # 最終ゲートもprompt構築と同じ理由で、実行するscriptをbase SHAに固定する。
      - name: Claude Review 投稿確認
        if: always()
        env:
          # GitHub-hostedランナーの gh は既定の認証情報を持たない。permissions: の宣言だけでは
          # stepにトークンが渡らないので、明示的に渡さないとscriptの gh api が必ず失敗し、
          # 正常にレビューできた場合でもcheckが赤くなる(required checkに配線すると全PRが止まる)。
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
          CLAUDE_ENABLED: ${{ steps.check.outputs.enabled }}
          CLAUDE_CONCLUSION: ${{ steps.claude.outputs.conclusion }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ACTION_STARTED_AT: ${{ steps.claude-started.outputs.started_at }}
          RESTORED_PATHS: ${{ steps.prompt.outputs.restored_paths }}
          ALLOWED_TOOLS: ${{ env.CLAUDE_REVIEW_ALLOWED_TOOLS }}
          # circuit-breaker step自体が失敗するとoutputは未設定(空文字)になる。空文字は
          # script側で配線不正として拒否され、claude actionが起動済みなのにこのstepが
          # 必ず落ちる非対称が生まれる(CodeRabbit指摘)。fail-open側(false)へ既定値を
          # 補い、上記circuit-breaker stepのfail-open方針と揃える。
          CIRCUIT_BREAKER_SKIP: ${{ steps.circuit-breaker.outputs.skip || 'false' }}
        run: |
          CHECK_SCRIPT="$RUNNER_TEMP/check-claude-review.mjs"
          git show "${BASE_SHA}:.github/scripts/check-claude-review.mjs" > "$CHECK_SCRIPT"
          node "$CHECK_SCRIPT"
