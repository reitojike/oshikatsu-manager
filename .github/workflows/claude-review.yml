# 何を守っているか:
# PRの自己チェックとしてClaudeにレビューさせる。実装したモデルとは別視点でのレビューを
# 全PRで自動発火させ、人間が起動を依頼する工程を挟まない(docs/prd.md 8.5)。
# 判定はあくまで参考。マージ可否の最終判断は人間が行う(docs/prd.md 8.6)。
name: Claude Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    runs-on: ubuntu-latest
    steps:
      - name: Check for CLAUDE_CODE_OAUTH_TOKEN
        id: check
        run: |
          if [ -n "${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLAUDE_CODE_OAUTH_TOKEN が未設定のためClaudeレビューをスキップします。'claude setup-token' で発行してリポジトリシークレットに追加してください。"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.enabled == 'true'
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        if: steps.check.outputs.enabled == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # claude-code-actionはenableAllProjectMcpServersを常にtrueにする仕様のため、
          # .mcp.jsonのcodexサーバー(ローカル専用。codex CLI未インストール・未ログインのCI環境では
          # 起動に失敗する)をdisabledMcpjsonServersで個別にブロックする。
          settings: |
            {
              "disabledMcpjsonServers": ["codex"]
            }
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            このPRをレビューしてください。AGENTS.mdとdocs/(prd.md, data-model.md,
            permissions.md, lint-policy.md, testing.md)の方針に沿っているかを重点的に見ること。

            特に確認する観点:
            - `as` キャスト、`any`、`eslint-disable`や`@ts-ignore`によるエラーの黙殺がないか
            - common/ に置くべき判断ロジックがapp/やmcp/に複製・直書きされていないか
            - 権限判定・削除時の分岐・公開設定の既定値など、静かに失敗する変更に
              テスト(特に否定側のテスト)が伴っているか
            - 型を手書きせず、生成型かZodスキーマのz.inferから導出しているか

            PRのブランチは既にカレントディレクトリにチェックアウト済み。
            全体の総評は `gh pr comment` で投稿すること。
            特定の行に対する指摘は `mcp__github_inline_comment__create_inline_comment`
            (`confirmed: true` を指定)でインラインコメントとして投稿すること。
            同一の根拠に基づく指摘が複数ファイル・複数箇所にまたがる場合は、
            対象箇所を列挙して `gh pr comment` の1件のコメントにまとめること。
            ファイルごとに同じ指摘を繰り返しインラインコメントで投稿しないこと。
            コードの自動修正は行わないこと。指摘はGitHubへのコメント投稿でのみ行い、
            メッセージ内のテキストとしては出力しないこと。
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
