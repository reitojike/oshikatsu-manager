# 何を守っているか:
# Claudeとは別ベンダーのモデル(OpenAI Codex)にもレビューさせる。単一ベンダーの
# 見落としパターンに依存しないための二重化(docs/prd.md 8.5「別のモデル」)。
# 判定はあくまで参考。マージ可否の最終判断は人間が行う(docs/prd.md 8.6)。
name: Codex Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: codex-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  codex-review:
    runs-on: ubuntu-latest
    steps:
      - name: Check for OPENAI_API_KEY
        id: check
        run: |
          if [ -n "${{ secrets.OPENAI_API_KEY }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Codexレビューは見送り(確定)のため常にスキップします。OPENAI_API_KEYはChatGPT Plusの利用枠ではなくOpenAI Platformの従量課金であり、取得しない方針です。詳細はdocs/roadmap.mdの「保留: 外部アカウント待ち」を参照してください。"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.enabled == 'true'
        with:
          fetch-depth: 0

      - uses: openai/codex-action@v1
        if: steps.check.outputs.enabled == 'true'
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt: |
            このPRをレビューしてください。AGENTS.mdとdocs/(prd.md, data-model.md,
            permissions.md, lint-policy.md, testing.md)の方針に沿っているかを重点的に見ること。

            特に確認する観点:
            - `as` キャスト、`any`、`eslint-disable`や`@ts-ignore`によるエラーの黙殺がないか
            - common/ に置くべき判断ロジックがapp/やmcp/に複製・直書きされていないか
            - 権限判定・削除時の分岐・公開設定の既定値など、静かに失敗する変更に
              テスト(特に否定側のテスト)が伴っているか
            - 型を手書きせず、生成型かZodスキーマのz.inferから導出しているか

            指摘はPRへのレビューコメントとして投稿してください。コードの自動修正は行わないこと。
            同一の根拠に基づく指摘が複数ファイル・複数箇所にまたがる場合は、
            対象箇所を列挙して1件のコメントにまとめること。ファイルごとに同じ指摘を
            繰り返し投稿しないこと。
